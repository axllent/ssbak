name: Integration tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml

  integration-tests:
    name: Integration tests (MariaDB)
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ssbak_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_USER: root
      TEST_DB_PASS: root
      TEST_DB_NAME: ssbak_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run integration tests
        run: go test -v -tags integration ./internal/sspak/

  e2e-tests:
    name: E2E save/load (MySQL, ${{ matrix.compression }})
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compression: gzip
            flags: ""
          - compression: zstd
            flags: "--zstd"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_USER: root
      TEST_DB_PASS: root
      TEST_DB_NAME: ssbak_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Ensure mysql client is installed
        run: command -v mysql >/dev/null || (sudo apt-get update && sudo apt-get install -y mysql-client)

      - name: Build ssbak
        run: go build -o ssbak .

      - name: Run e2e test
        run: SSBAK_BIN=./ssbak ./e2e/e2e.sh ${{ matrix.flags }}
